      ctx.setLineDash([]);

      // Crosshair & Hover
      if (mouseX >= padL && mouseX <= w - padR) {
        const hoverT = minT + ((mouseX - padL) / plotW) * (maxT - minT);
        let nearest = data[0];
        let minDist = Math.abs(nearest[0] - hoverT);
        for (let i = 1; i < data.length; i++) {
          const dist = Math.abs(data[i][0] - hoverT);
          if (dist < minDist) {
            minDist = dist;
            nearest = data[i];
          } else if (dist > minDist && data[i][0] > hoverT) {
            break;
          }
        }

        const nx = getX(nearest[0]);
        const ny = getY(nearest[1]);

        ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 2]);
        ctx.beginPath();
        ctx.moveTo(nx, padT);
        ctx.lineTo(nx, h - padB);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(nx, ny, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        tooltip.style.display = 'block';
        ttTime.innerText = nearest[2] + ' UTC';
        ttVal.innerText = nearest[1] + ' ppm TDS';

        const ttWidth = tooltip.offsetWidth || 130;
        let ttX = nx - ttWidth / 2;
        if (ttX < 10) ttX = 10;
        if (ttX + ttWidth > w - 10) ttX = w - ttWidth - 10;
        tooltip.style.left = ttX + 'px';
        tooltip.style.top = Math.max(10, ny - 50) + 'px';
      } else {
        tooltip.style.display = 'none';
      }
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
      render();
    });

    canvas.addEventListener('mouseleave', () => {
      mouseX = -1;
      mouseY = -1;
      tooltip.style.display = 'none';
      render();
    });

    setTimeout(resizeCanvas, 50);
  </script>
</body>
</html>
