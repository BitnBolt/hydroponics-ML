    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');
    const ttTime = document.getElementById('tt-time');
    const ttVal = document.getElementById('tt-val');

    let mouseX = -1;
    let mouseY = -1;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = 260 * dpr;
      ctx.scale(dpr, dpr);
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    function render() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = 260;
      ctx.clearRect(0, 0, w, h);

      if (!data || data.length === 0) return;

      const padL = 40, padR = 20, padT = 15, padB = 30;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;

      const minT = data[0][0];
      const maxT = data[data.length - 1][0];
      const minY = 28;
      const maxY = 50;

      const getX = t => padL + ((t - minT) / (maxT - minT || 1)) * plotW;
      const getY = v => padT + (1 - (v - minY) / (maxY - minY)) * plotH;

      // Grid & Y-Ticks
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)';
      ctx.fillStyle = 'rgba(148, 163, 184, 0.7)';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';

      const yTicks = [30, 35, 40, 45, 50];
      for (const yt of yTicks) {
        const yPos = getY(yt);
        ctx.beginPath();
        ctx.setLineDash([4, 4]);
        ctx.moveTo(padL, yPos);
        ctx.lineTo(w - padR, yPos);
        ctx.stroke();
        ctx.fillText(yt + '°C', padL - 6, yPos);
      }
      ctx.setLineDash([]);

      // Baseline at 32°C
      const base32 = getY(32.0);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(padL, base32);
      ctx.lineTo(w - padR, base32);
      ctx.stroke();
      ctx.setLineDash([]);

      // Vertical line at 14:09 transition
      const t1409 = new Date('2025-08-12T14:09:56').getTime();
      const x1409 = getX(t1409);
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
      ctx.lineWidth = 1;
      ctx.setLineDash([2, 2]);
      ctx.beginPath();
      ctx.moveTo(x1409, padT);
      ctx.lineTo(x1409, h - padB);
      ctx.stroke();
      ctx.setLineDash([]);

      // X-Ticks
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const numXTicks = 8;
      for (let i = 0; i <= numXTicks; i++) {
        const tVal = minT + (i / numXTicks) * (maxT - minT);
        const xPos = getX(tVal);
        const dateObj = new Date(tVal);
        const timeStr = dateObj.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
        ctx.fillText(timeStr, xPos, h - padB + 8);
      }

      // Gradient Area
      const grad = ctx.createLinearGradient(0, padT, 0, h - padB);
      grad.addColorStop(0, 'rgba(249, 115, 22, 0.35)');
      grad.addColorStop(1, 'rgba(249, 115, 22, 0.02)');

      ctx.beginPath();
      ctx.moveTo(getX(data[0][0]), h - padB);
      for (const pt of data) {
        ctx.lineTo(getX(pt[0]), getY(pt[1]));
      }
      ctx.lineTo(getX(data[data.length - 1][0]), h - padB);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Continuous Line
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = '#f97316';
      ctx.beginPath();
      for (let i = 0; i < data.length; i++) {
        const x = getX(data[i][0]);
        const y = getY(data[i][1]);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Points
      ctx.fillStyle = '#fb923c';
      for (const pt of data) {
        const x = getX(pt[0]);
        const y = getY(pt[1]);
        ctx.beginPath();
        ctx.arc(x, y, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }

      // Crosshair & Hover
      if (mouseX >= padL && mouseX <= w - padR) {
        const hoverT = minT + ((mouseX - padL) / plotW) * (maxT - minT);
        let nearest = data[0];
        let minDist = Math.abs(nearest[0] - hoverT);
        for (let i = 1; i < data.length; i++) {
          const dist = Math.abs(data[i][0] - hoverT);
          if (dist < minDist) {
            minDist = dist;
            nearest = data[i];
          } else if (dist > minDist && data[i][0] > hoverT) {
            break;
          }
        }

        const nx = getX(nearest[0]);
        const ny = getY(nearest[1]);

        ctx.strokeStyle = 'rgba(249, 115, 22, 0.4)';
        ctx.lineWidth = 1;
        ctx.setLineDash([2, 2]);
        ctx.beginPath();
        ctx.moveTo(nx, padT);
        ctx.lineTo(nx, h - padB);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(nx, ny, 5, 0, Math.PI * 2);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        tooltip.style.display = 'block';
        ttTime.innerText = nearest[2] + (nearest[0] > t1409 ? ' (Extended Point)' : '');
        ttVal.innerText = nearest[1] + '°C Temp';

        const ttWidth = tooltip.offsetWidth || 130;
        let ttX = nx - ttWidth / 2;
        if (ttX < 10) ttX = 10;
        if (ttX + ttWidth > w - 10) ttX = w - ttWidth - 10;
        tooltip.style.left = ttX + 'px';
        tooltip.style.top = Math.max(10, ny - 50) + 'px';
      } else {
        tooltip.style.display = 'none';
      }
    }

    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouseX = e.clientX - rect.left;
      mouseY = e.clientY - rect.top;
      render();
    });

    canvas.addEventListener('mouseleave', () => {
      mouseX = -1;
      mouseY = -1;
      tooltip.style.display = 'none';
      render();
    });

    setTimeout(resizeCanvas, 50);
